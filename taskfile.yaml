version: "3"

# Both entry points use the same build implementation and package identity.
tasks:
  default:
    cmds: ["make package"]
  install-deps:
    cmds: ["make deps"]
  build-ts:
    cmds: ["npm run build"]
  package:
    aliases: [kwin-pkg-file, kwin-pkg]
    cmds: ["make package"]
  test:
    cmds: ["make test"]
  test-kwin:
    cmds: ["make test-kwin"]
  install:
    cmds: ["make install"]
  uninstall:
    cmds: ["make uninstall"]
  clean:
    cmds: ["make clean"]
